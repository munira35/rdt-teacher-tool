:root{--g:#2F6B52;--gd:#234F3D;--gl:#E4EFE8;--ink:#1F2D2A;--mut:#5E6B67;--line:#D6DFD9;--bg:#F7F5EF;--panel:#fff;--y:#B7791F;--yl:#FBF1DF;--r:#A63E31;--rl:#F6E5E1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:TJ,Tahoma,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 16px 8px}
header .row{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:820px;margin:auto}
header h1{font-size:17px;margin:0;font-weight:700}
header .who{font-size:13px;opacity:.9}
header .lang{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
main{max-width:820px;margin:auto;padding:14px 16px 110px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;gap:4px;max-width:820px;width:100%}
nav button{flex:1;border:0;background:none;border-radius:10px;padding:6px 2px;font-size:13px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button[aria-current=true]{background:var(--gl);color:var(--gd);font-weight:700}
h2{font-size:19px;margin:6px 0 4px}
h3{font-size:16px;margin:18px 0 6px}
.hint{color:var(--mut);font-size:14px;margin:2px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--g);color:#fff;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.sec{background:var(--gl);color:var(--gd)}
.btn.ghost{background:none;color:var(--gd);border:1.5px solid var(--line)}
.btn.warn{background:var(--rl);color:var(--r)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{border-radius:10px}
.lv1[aria-pressed=true]{background:#2F7A4F;border-color:#2F7A4F}.lv2[aria-pressed=true]{background:var(--y);border-color:var(--y)}.lv3[aria-pressed=true]{background:var(--r);border-color:var(--r)}
label.f{display:block;margin:10px 0 4px;font-weight:700;font-size:14px}
input.t,textarea.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
textarea.t{min-height:64px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:pointer;padding:0}
.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.ph span{position:absolute;inset:auto 0 0 0;background:rgba(31,45,42,.78);color:#fff;font-size:11px;padding:3px 6px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .new{position:absolute;top:6px;inset-inline-start:6px;background:var(--y);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px}
.ph[aria-pressed=true]{outline:3px solid var(--g);outline-offset:-3px}
.fold{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 6px}
.fold b{font-size:15px}
.cnt{background:var(--gl);color:var(--gd);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.dom{border-top:1px solid var(--line);padding:10px 0}
.dom:first-of-type{border-top:0}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-grid button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px 10px;cursor:pointer;text-align:center;font-weight:700}
.who-grid button small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.ok{background:var(--gl);color:var(--gd);border-radius:10px;padding:10px 12px;font-size:14px}
.note{background:var(--yl);color:#6B4A12;border-radius:10px;padding:10px 12px;font-size:14px}
.steps{padding-inline-start:20px;margin:6px 0}.steps li{margin:4px 0}
.path{direction:ltr;unicode-bidi:plaintext;font-size:13px;background:#F1F4F2;border-radius:8px;padding:6px 8px;color:var(--gd);word-break:break-word}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,28,26,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:96vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px 24px}
.cv{position:relative;touch-action:none;background:#222;border-radius:10px;overflow:hidden;margin:6px 0}
.cv canvas{display:block;width:100%;height:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:6px}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .thumb{width:86px;height:110px;border-radius:8px;background:#EEF1EF;border:1.5px dashed var(--line);flex:0 0 86px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center}
.slot .thumb img{width:100%;height:100%;object-fit:cover}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.prog span{font-size:12px;border-radius:999px;padding:2px 9px;background:#EEF1EF;color:var(--mut)}
.prog span.d{background:var(--gl);color:var(--gd);font-weight:700}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:28px}
@media(max-width:420px){.row2{grid-template-columns:1fr}}
.stepper{display:flex;gap:4px;margin:0 0 12px}
.stepper button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;font-size:12px;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.stepper button b{font-size:15px}
.stepper button.on{border-color:var(--g);color:var(--gd);font-weight:700}
.stepper button.ok{background:var(--gl);border-color:var(--gl);color:var(--gd)}
.req{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle;background:var(--rl);color:var(--r)}
.req.o{background:#EEF1EF;color:var(--mut)}
.req.d{background:var(--gl);color:var(--gd)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0}
.crumbs span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
.crumbs span.me{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.crumbs i{color:var(--mut);font-style:normal}
.lvb{position:absolute;top:6px;inset-inline-end:6px;border-radius:6px;font-size:11px;padding:1px 7px;color:#fff;font-style:normal}
.lvb.L0{background:#7D8B94}.lvb.L1{background:#3F7FA8}.lvb.L2{background:#2F7A4F}
.chip.L0[aria-pressed=true]{background:#7D8B94;border-color:#7D8B94;color:#fff}.chip.L1[aria-pressed=true]{background:#3F7FA8;border-color:#3F7FA8;color:#fff}.chip.L2[aria-pressed=true]{background:#2F7A4F;border-color:#2F7A4F;color:#fff}
.lv3[aria-pressed=true]{background:#7D8B94!important;border-color:#7D8B94!important}
.dock{position:fixed;left:0;right:0;bottom:62px;z-index:5;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.dock .in{pointer-events:auto;max-width:796px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);padding:8px;display:flex;align-items:center;gap:10px}
.dock small{flex:1;color:var(--mut);font-size:13px}
.hero{background:var(--g);color:#fff;border-radius:16px;padding:16px}
.hero h2{color:#fff;margin:0 0 6px}
.hero ul{margin:6px 0 0;padding-inline-start:18px}.hero li{margin:4px 0}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.four div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px}
.four b{display:block;font-size:20px}
.four em{display:block;font-style:normal;color:var(--mut);font-size:11px}
.lbl{}@media(max-width:520px){.lbl{display:none}header .lang{font-size:15px;padding:4px 9px}}

/* ===== visual layer ===== */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
header .lang{display:inline-flex;align-items:center;gap:4px}
.dl{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;margin:0 0 14px;border:1px solid transparent}
.dl .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.dl .ico svg{width:22px;height:22px}
.dl b{display:block;font-size:15px}.dl small{display:block;font-size:13px;opacity:.85}
.dl .days{margin-inline-start:auto;text-align:center;font-weight:700;line-height:1.1}
.dl .days strong{display:block;font-size:24px}
.dl.ok{background:#E4EFE8;color:#234F3D}.dl.ok .ico{background:#2F6B52;color:#fff}
.dl.calm{background:#EAF1F6;color:#24485C}.dl.calm .ico{background:#2F6E8E;color:#fff}
.dl.soon{background:#FBF1DF;color:#6B4A12}.dl.soon .ico{background:#C98A1E;color:#fff}
nav button{position:relative}
nav button .bd{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);background:#C0442F;color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
nav button svg{width:22px;height:22px}
nav button.okk svg{color:#2F7A4F}
.addcard{display:flex;align-items:center;gap:14px;width:100%;border:2px dashed #9EC2AE;background:linear-gradient(135deg,#EEF6F1,#F7FBF8);border-radius:16px;padding:16px;cursor:pointer;color:var(--gd)}
.addcard .ico{width:54px;height:54px;border-radius:16px;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
.addcard .ico svg{width:28px;height:28px}
.addcard b{font-size:17px;display:block}.addcard small{color:var(--mut);font-size:13px}
.folders{display:grid;gap:12px;margin-top:14px}
@media(min-width:760px){main,header .row,nav .in{max-width:1040px}.folders{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.fcard .fh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.fcard .fh .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.fcard .fh b{flex:1;font-size:15px}
.fcard .fh .cnt{font-size:14px}
.fcard .fb{padding:0 12px 12px}
.fcard .empty{border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--mut);font-size:13px;text-align:center}
.fcard .empty .eg{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.fcard .empty .eg span{background:#F3F5F4;border-radius:999px;padding:2px 9px;font-size:12px}
.fW .fh{background:#F7EFDD}.fW .ico{background:#C98A1E;color:#fff}
.fT .fh{background:#E3EEF4}.fT .ico{background:#2F6E8E;color:#fff}
.fS .fh{background:#E4EFE8}.fS .ico{background:#2F6B52;color:#fff}
.fcard .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:560px){.tcards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tcard{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:700;color:var(--ink)}
.tcard .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tcard small{font-weight:400;color:var(--mut);font-size:11px}
.tcard[aria-pressed=true]{border-color:var(--g);background:#F0F7F3;box-shadow:0 0 0 2px #2F6B5222}
.tW .ico{background:#C98A1E}.tT .ico{background:#2F6E8E}.tS .ico{background:#2F6B52}.tP .ico{background:#7A5BA6}
.stp{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-weight:700;font-size:15px}
.stp i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:#EEF1EF;color:var(--mut);flex:none}
.stp i.d{background:#2F7A4F;color:#fff}
.stp i.need{background:#FBF1DF;color:#9A5B10;box-shadow:0 0 0 2px #E7B65A}
.cvwrap{position:relative}
.cvbadge{position:absolute;top:8px;inset-inline-start:8px;z-index:2;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;pointer-events:none}
.cvbadge.no{background:#FBF1DF;color:#6B4A12;animation:pulse 1.6s ease-in-out infinite}
.cvbadge.yes{background:#E4EFE8;color:#234F3D}
@keyframes pulse{50%{box-shadow:0 0 0 6px #E7B65A33}}
@media(prefers-reduced-motion:reduce){.cvbadge.no{animation:none}}
h3.sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sh .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:#EEF1EF;color:var(--mut)}
h3.sh .num.d{background:#2F7A4F;color:#fff}
.tl{list-style:none;padding:0;margin:8px 0;position:relative}
.tl li{display:flex;gap:12px;padding:0 0 16px;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;inset-inline-start:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.tl .ico{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;flex:none}
.tl .ico svg{width:18px;height:18px}
.tl div{padding-top:6px}
.cl{list-style:none;padding:0;margin:0 0 12px}
.cl li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.cl li .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.cl li.y .ico{background:#2F7A4F;color:#fff}.cl li.n .ico{background:#FBF1DF;color:#9A5B10}
.cl li button{margin-inline-start:auto}


.wz{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.wz::-webkit-scrollbar{display:none}
.wzs{flex:1 0 auto;min-width:72px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);padding:2px}
.wzs i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#EEF1EF;color:var(--mut);font-style:normal;transition:transform .15s}
.wzs.on i{background:var(--g);color:#fff;transform:scale(1.1);box-shadow:0 4px 12px #2F6B5240}
.wzs.on{color:var(--gd);font-weight:700}
.wzs.d i{background:#DDEFE4;color:#2F7A4F}
.wzbar{height:6px;border-radius:999px;background:#E6ECE8;overflow:hidden;margin:2px 0 16px}
.wzbar i{display:block;height:100%;background:linear-gradient(90deg,#2F6B52,#4FA37A);border-radius:999px;transition:width .3s}
.wzt{font-size:20px;margin:6px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 #D6DFD9;transition:transform .08s,box-shadow .15s,background .15s;min-height:96px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #D6DFD9}
.tile small{font-weight:400;color:var(--mut);font-size:12px}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#EEF4F0;color:var(--g)}
.tile .ti svg{width:24px;height:24px}
.tile[aria-pressed=true]{border-color:var(--g);background:#F0F7F3;box-shadow:0 3px 0 #2F6B52}
.tile[aria-pressed=true] .ti{background:var(--g);color:#fff}
.tile[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;display:grid;place-items:center}
.tile.sm{min-height:56px;font-size:13px;padding:10px}
.tile.big{min-height:84px}
.tile .cls{font-size:26px;font-weight:800;letter-spacing:.5px}
.excard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px}
.exh{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--gd)}
.mini{font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 6px}
.dgrid{display:grid;gap:10px}
@media(min-width:760px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px}
.dcard.set{border-color:#BFD9C9}
.dcard b{display:block;margin-bottom:10px;font-size:15px}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl{border:2px solid var(--line);background:#FAFBFA;border-radius:14px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--mut);box-shadow:0 3px 0 #D6DFD9}
.lvl svg{width:22px;height:22px}
.lvl:active{transform:translateY(2px);box-shadow:0 1px 0 #D6DFD9}
.lvl.v0[aria-pressed=true]{background:#2F7A4F;border-color:#2F7A4F;color:#fff;box-shadow:0 3px 0 #1F5C3A}
.lvl.v1[aria-pressed=true]{background:#3F7FA8;border-color:#3F7FA8;color:#fff;box-shadow:0 3px 0 #2C5F80}
.lvl.v2[aria-pressed=true]{background:#7D8B94;border-color:#7D8B94;color:#fff;box-shadow:0 3px 0 #5E6A72}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.scard{border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 #D6DFD9;color:var(--ink)}
.scard .sth{width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#F1F4F2;display:grid;place-items:center}
.scard .sth img{width:100%;height:100%;object-fit:cover}
.scard .sadd{width:44px;height:44px;border-radius:50%;background:#fff;border:2px dashed #9EC2AE;display:grid;place-items:center;color:var(--g)}
.scard small{font-size:11px;color:var(--mut);text-align:center;line-height:1.3}
.ready{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 16px;margin-bottom:12px}
.ready .big{width:64px;height:64px;border-radius:50%;display:inline-grid;place-items:center;background:#EEF1EF;color:var(--mut)}
.ready .big svg{width:32px;height:32px}
.ready.yes .big{background:linear-gradient(135deg,#2F6B52,#4FA37A);color:#fff;animation:pop .5s ease}
.ready h2{margin:10px 0 4px}.ready p{margin:0;color:var(--mut)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.dock .in{justify-content:space-between}.dock .in .btn{padding:10px 16px}
@media(prefers-reduced-motion:reduce){.ready.yes .big,.wzs i,.wzbar i{animation:none;transition:none}}

.nextc{background:#fff;border:1px solid #BFD9C9;border-radius:18px;padding:12px;margin-top:14px;box-shadow:0 3px 0 #DDEFE4}
.nh{display:flex;align-items:center;gap:8px;color:var(--gd);margin:2px 2px 10px}
.nh svg{background:#2F7A4F;color:#fff;border-radius:50%;padding:3px;width:22px;height:22px}
.nacts{display:grid;gap:8px}@media(min-width:760px){.nacts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nact{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#FAFBFA;border-radius:16px;padding:12px;cursor:pointer;text-align:start;color:var(--ink);box-shadow:0 3px 0 #D6DFD9}
.nact:active{transform:translateY(2px);box-shadow:0 1px 0 #D6DFD9}
.nact .ico{width:42px;height:42px;border-radius:12px;background:#EEF4F0;color:var(--g);display:grid;place-items:center;flex:none}
.nact b{display:block;font-size:15px}.nact small{display:block;color:var(--mut);font-size:12px}
.nact .go{margin-inline-start:auto;font-size:22px;color:var(--mut)}
.nact.pri{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 3px 0 #1F4A38}
.nact.pri .ico{background:rgba(255,255,255,.18);color:#fff}.nact.pri small,.nact.pri .go{color:#DDEFE4}
.ph .new.ok{background:#2F7A4F;padding:2px 4px;display:grid;place-items:center}.ph .new.ok svg{width:12px;height:12px}
.up3 .ustat,.ustat{border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff}
.ustat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.ustat.fW .ico{background:#C98A1E}.ustat.fT .ico{background:#2F6E8E}.ustat.fS .ico{background:#2F6B52}
.ustat b{font-size:24px;line-height:1}.ustat small{font-size:12px;color:var(--mut)}

.ustat em.z{background:#E4EFE8;color:#2F7A4F;display:grid;place-items:center;min-width:22px;min-height:18px}.ustat em.z svg{width:12px;height:12px}
.hero-btn{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;border:0;border-radius:20px;padding:16px 18px;cursor:pointer;background:linear-gradient(135deg,#2F6B52,#3F8A68);color:#fff;text-align:start;box-shadow:0 5px 0 #1F4A38;text-decoration:none}
.hero-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1F4A38}
.hero-btn .ico{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.hero-btn .ico svg{width:28px;height:28px}.hero-btn b{display:block;font-size:18px}.hero-btn small{display:block;font-size:13px;color:#DDEFE4}
.hero-btn.wa{background:linear-gradient(135deg,#1F8A4C,#25A85C);box-shadow:0 5px 0 #166B3A}
.okbar{display:flex;align-items:center;gap:8px;background:#E4EFE8;color:#234F3D;border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:700}
.ustep{display:grid;gap:10px;margin-top:14px}@media(min-width:760px){.ustep{grid-template-columns:repeat(4,minmax(0,1fr))}}
.uc{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;color:var(--ink);box-shadow:0 3px 0 #D6DFD9}
.uc>i{position:absolute;top:10px;inset-inline-end:10px;width:24px;height:24px;border-radius:50%;background:#EEF1EF;color:var(--mut);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.uc .ico{width:40px;height:40px;border-radius:12px;background:#EEF4F0;color:var(--g);display:grid;place-items:center}
.uc b{font-size:15px}.uc small{color:var(--mut);font-size:12px}
.uc.go{cursor:pointer;border-color:var(--g);background:#F0F7F3}
.uc .crumbs span{font-size:11px;padding:2px 6px}
.dhero{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.dhero h2{margin:0 0 4px;font-size:18px}.dhero p{margin:0;color:var(--mut);font-size:14px}
.ring{--p:0;width:76px;height:76px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#2F7A4F calc(var(--p)*1%),#E6ECE8 0)}
.ring b{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px}
.dstat{border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit}
button.dstat{cursor:pointer;box-shadow:0 3px 0 #D6DFD9}
.dstat .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.dstat.y .ico{background:#2F7A4F;color:#fff}.dstat.n .ico{background:#FBF1DF;color:#9A5B10}
.dstat small{font-size:12px;font-weight:700}.dstat em{font-style:normal;font-size:11px;color:var(--g);font-weight:700}
.warnbox{background:var(--rl);color:var(--r);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}

function isHeic(f){return /hei[cf]/i.test(f.type||'')||/\.hei[cf]$/i.test(f.name||'')}

 const viaImg=()=>new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(f)});

 let src=null;try{src=await viaImg()}catch(e){try{if(window.createImageBitmap)src=await viaBmp()}catch(_){}}
 if(src){editor({src,isNew:true,file:f});return}

function editor(o){const p=o.p||{type:P.lastType||'S',cls:P.lastCls||'',desc:[],level:null,date:today(),rot:0,rects:[]};const st={p:JSON.parse(JSON.stringify({...p,blob:undefined})),img:o.src,rot:0,rects:[],isNew:o.isNew};
 const m=document.getElementById('modal');

 function body(){const ty=typeOf(st.p.type);const sh0=m.querySelector('.sheet');const y0=sh0?sh0.scrollTop:0;m.innerHTML=`<div class="modal"><div class="sheet">

 ${o.isNew?`<div class="stp"><i id="stp1" class="${st.rects.length?'d':'need'}">${st.rects.length?'✓':'1'}</i>${t('غطّي اسم الطالبة','Cover the student name')}</div><p class="hint" style="margin:0 0 6px">${t('اسحبي إصبعك أو الماوس على الاسم.','Drag your finger or mouse over the name.')}</p><div class="cvwrap"><span id="cvb" class="cvbadge ${st.rects.length?'yes':'no'}">${st.rects.length?ic('check')+t('غُطّي','Covered'):ic('lock')+t('غطّي الاسم','Cover the name')}</span><div class="cv" id="cvw"><canvas id="cv"></canvas></div></div>
 <div class="toolbar"><button class="btn sec" data-e="top">${t('تغطية أعلى الورقة','Cover top of page')}</button><button class="btn ghost" data-e="undo">${t('تراجع','Undo')}</button><button class="btn ghost" data-e="rot">${t('تدوير','Rotate')} ↻</button></div>`:`<img src="${url(o.p)}" style="width:100%;max-height:46vh;object-fit:contain;border-radius:10px;background:#222">`}
 <div class="stp"><i class="d">${o.isNew?'2':'1'}</i>${t('نوع الصورة','Photo type')}</div><div class="tcards">${TYPES.map(x=>`<button class="tcard t${x.k}" data-ty="${x.k}" aria-pressed="${st.p.type===x.k}"><span class="ico">${ic(TYIC[x.k])}</span>${esc(L([x.ar,x.en]))}<small>${esc(L([x.ha,x.he]))}</small></button>`).join('')}</div>
 ${st.p.type==='S'?`<div class="stp"><i class="${st.p.level!=null?'d':'need'}">${st.p.level!=null?'✓':'·'}</i>${t('مستوى العمل','Work level')}</div><div class="seg">${LEVELS.map((l,i)=>chip(`data-lv="${i}"`,st.p.level===i,L(l),'L'+i)).join('')}</div>`:''}
 <div class="stp"><i class="${st.p.cls?'d':'need'}">${st.p.cls?'✓':(o.isNew?'3':'2')}</i>${t('الشعبة','Class')}</div><div class="seg">${CLS.map(c=>chip(`data-cl="${c}"`,st.p.cls===c,c)).join('')}</div>
 <div class="stp"><i class="${(st.p.desc||[]).length?'d':''}">${(st.p.desc||[]).length?'✓':(o.isNew?'4':'3')}</i>${st.p.type==='P'?t('قبل أم بعد؟','Before or after?'):t('ماذا في الصورة؟','What is in the photo?')} ${st.p.type==='P'?'':`<span class="req o">${t('اختياري','Optional')}</span>`}</div><div class="chips">${ty.d.map(d=>chip(`data-ds="${esc(L(d))}"`,(st.p.desc||[]).includes(L(d)),L(d))).join('')}</div>

  const sh1=m.querySelector('.sheet');
